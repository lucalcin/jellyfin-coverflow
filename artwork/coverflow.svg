<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">CoverFlow</title>
  <desc id="desc">Five luminous covers in perspective above a polished dark surface.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="38%" r="72%">
      <stop stop-color="#233e53"/>
      <stop offset=".58" stop-color="#101b29"/>
      <stop offset="1" stop-color="#070d17"/>
    </radialGradient>
    <linearGradient id="center" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6ce4f2"/>
      <stop offset=".48" stop-color="#16b7de"/>
      <stop offset="1" stop-color="#3473d7"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#745bb9"/>
      <stop offset="1" stop-color="#244368"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#50bbd9"/>
      <stop offset="1" stop-color="#365589"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff" stop-opacity=".8"/>
      <stop offset=".52" stop-color="#fff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="reflection" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fade"><rect x="0" y="377" width="960" height="100" fill="url(#reflection)"/></mask>
    <filter id="glow" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="shadow" x="-40%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <g id="covers" stroke-linejoin="round">
      <path d="M165 196 253 167V350l-88-17Z" fill="url(#side)" stroke="#a693df" stroke-opacity=".36" stroke-width="2"/>
      <path d="M707 167 795 196v137l-88 17Z" fill="url(#side)" stroke="#a693df" stroke-opacity=".36" stroke-width="2"/>
      <path d="m267 161 103-29v236l-103-21Z" fill="url(#near)" stroke="#9adff1" stroke-opacity=".55" stroke-width="2"/>
      <path d="m590 132 103 29v186l-103 21Z" fill="url(#near)" stroke="#9adff1" stroke-opacity=".55" stroke-width="2"/>
      <path d="m181 211 56-17M181 222l56-16m46-29 71-20m-71 32 71-20m252-12 71 20m-71-8 71 20m46 5 56 17m-56-5 56 16" fill="none" stroke="#e0eafa" stroke-opacity=".18" stroke-width="3" stroke-linecap="round"/>
      <rect x="386" y="106" width="188" height="266" rx="15" fill="url(#center)" stroke="url(#shine)" stroke-width="3"/>
      <path d="M402 123h156" stroke="#eaffff" stroke-opacity=".6" stroke-width="2" stroke-linecap="round"/>
      <path d="m410 333 46-56 35 35 23-24 35 45Z" fill="#e8faff" fill-opacity=".16"/>
      <circle cx="521" cy="253" r="13" fill="#e8faff" fill-opacity=".2"/>
      <path d="M470 198v72l51-36Z" fill="#fff" fill-opacity=".95"/>
      <path d="M419 140v176" stroke="#fff" stroke-opacity=".12" stroke-width="2"/>
    </g>
  </defs>
  <rect width="960" height="540" fill="url(#background)"/>
  <ellipse cx="480" cy="349" rx="250" ry="34" fill="#12acd8" opacity=".18" filter="url(#glow)"/>
  <path d="M100 378H860" stroke="#6cc6e5" stroke-opacity=".1"/>
  <g mask="url(#fade)"><use href="#covers" transform="translate(0 750) scale(1 -1)"/></g>
  <use href="#covers" filter="url(#shadow)"/>
  <text x="480" y="475" text-anchor="middle" fill="#f2f7fc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="42" font-weight="600" letter-spacing="1">CoverFlow</text>
</svg>
