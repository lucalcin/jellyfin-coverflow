name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm test
      - name: Install isolated test browser
        run: npx playwright install --with-deps chromium
      - name: Browser fixture
        run: npm run test:browser
      - name: Build plugin
        run: dotnet publish Jellyfin.Plugin.CoverFlow/Jellyfin.Plugin.CoverFlow.csproj --configuration Release --output dist/publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverflow-build
          path: dist/publish/Jellyfin.Plugin.CoverFlow.dll
          if-no-files-found: error
